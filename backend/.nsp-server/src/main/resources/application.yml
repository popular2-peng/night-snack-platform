# ============================================================
# 夜宵外卖平台 — 主配置（所有环境共用）
# 环境相关配置在各 profile 文件中：application-{profile}.yml
# ⚠️ 敏感值走环境变量 ${ENV_VAR}
# ============================================================

server:
  port: 8080

spring:
  application:
    name: night-snack-platform

  # 默认使用 dev profile
  profiles:
    active: dev

  # Jackson 全局配置
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # Flyway 数据库迁移（各环境统一启用）
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.nsp.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# SpringDoc OpenAPI（Swagger UI）
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  packages-to-scan: com.nsp.server.controller
