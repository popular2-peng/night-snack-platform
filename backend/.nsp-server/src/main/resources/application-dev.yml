# ============================================================
# 夜宵外卖平台 — 开发环境配置
# spring.profiles.active=dev 时激活
# ⚠️ 真实密钥在 .env 文件中，不提交 Git
# ============================================================

spring:
  # 数据源（MySQL）
  datasource:
    url: ${NSP_DB_URL:jdbc:mysql://localhost:3306/nsp_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${NSP_DB_USER:root}
    password: ${NSP_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  # Redis
  data:
    redis:
      host: ${NSP_REDIS_HOST:localhost}
      port: ${NSP_REDIS_PORT:6379}
      password: ${NSP_REDIS_PASSWORD:}
      database: ${NSP_REDIS_DATABASE:0}
      jedis:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

# JWT
nsp:
  jwt:
    secret: ${JWT_SECRET:please-change-me}
    access-expiration-ms: 7200000
    refresh-expiration-ms: 604800000

# 阿里云 OSS
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-shenzhen.aliyuncs.com}
    bucket: ${ALIYUN_OSS_BUCKET:nsp-upload}
    access-key-id: ${ALIYUN_OSS_AK:placeholder}
    access-key-secret: ${ALIYUN_OSS_SK:placeholder}
    region: ${ALIYUN_OSS_REGION:shenzhen}
    cdn-domain: ${ALIYUN_OSS_CDN:placeholder}
    callback-url: ${ALIYUN_OSS_CALLBACK:placeholder}

# 百度地图
baidu:
  map:
    ak: ${BAIDU_MAP_AK:placeholder}
    distance-api: https://api.map.baidu.com/directionlite/v1/driving

# 支付宝沙箱
alipay:
  app-id: ${ALIPAY_APP_ID:placeholder}
  private-key: ${ALIPAY_PRIVATE_KEY:placeholder}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:placeholder}
  notify-url: ${ALIPAY_NOTIFY_URL:placeholder}
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do

# 开发环境日志
logging:
  level:
    com.nsp: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
