# ============================================================
# 用户端 H5 — 站点 :80（默认站点）
# 部署路径：/etc/nginx/sites-available/nsp-user
# 前端工程：frontend-user（Vant 4 移动端）
# ============================================================
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    root  /var/www/nsp-user;
    index index.html;

    access_log /var/log/nginx/nsp-user.access.log;
    error_log  /var/log/nginx/nsp-user.error.log;

    # ---------- 静态资源 ----------
    # index.html 绝不缓存：保证前端发版后用户立即拿到新版本
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # vite 构建产物带内容 hash，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ---------- SPA 路由兜底（vue-router history 模式）----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端 API 反向代理 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        client_max_body_size  10m;
    }

    # ---------- 后端 API 文档与健康检查 ----------
    # 后端只监听 127.0.0.1:8080，不对外暴露；这里按需放行文档与健康检查。
    # Swagger UI 需要匿名可访问，供 Apifox 导入接口定义（见 CLAUDE.md 第十五节）。
    location = /swagger-ui.html {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Swagger UI 的静态资源（/swagger-ui/index.html、/swagger-ui/swagger-ui.css 等）
    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # OpenAPI 3 描述文件：Apifox「导入 → OpenAPI」填的就是这个地址
    location /v3/api-docs {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查（供部署脚本 / 监控探活）
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---------- WebSocket（商家端订单/退款实时推送）----------
    # 前端连接地址：ws://<host>/ws/merchant?token=xxx
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
