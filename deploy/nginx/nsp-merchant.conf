# ============================================================
# 商家后台 — 站点 :8081
# 部署路径：/etc/nginx/sites-available/nsp-merchant
# 前端工程：frontend-merchant（Element Plus 桌面端）
# ⚠️ 本站点额外需要 /ws 反代：商家端靠 WebSocket 实时接单 + 接收退款申请
# ============================================================
server {
    listen       8081;
    listen       [::]:8081;
    server_name  _;

    root  /var/www/nsp-merchant;
    index index.html;

    access_log /var/log/nginx/nsp-merchant.access.log;
    error_log  /var/log/nginx/nsp-merchant.error.log;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        client_max_body_size  10m;
    }

    # WebSocket：商家端 new WebSocket(`ws://${location.host}/ws/merchant?token=xxx`)
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        # 长连接：避免商家挂着页面时被 Nginx 主动断开
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
