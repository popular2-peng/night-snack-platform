[pytest]
; ===== 运行习惯：-v 显示用例名，-s 放开 print/日志输出 =====
addopts = -vs

; ===== 只收集 testcases/ 目录下的用例 =====
testpaths = testcases

; ===== 定义标记，防止 PytestUnknownMarkWarning =====
markers =
    smoke: 冒烟用例（核心链路，发布前必跑）
    p1: 高优先级（核心功能）
    p2: 中优先级（常规功能）
    p3: 低优先级（边界/异常/体验）
    auth: 登录鉴权相关
    order: 订单相关
    browse: 浏览相关
    cart: 购物车相关
    payment: 支付相关
    user: 用户/地址相关
    merchant: 商家相关
    admin: 管理后台相关
    db: 涉及数据库校验（pymysql）
    redis: 涉及 Redis 校验（redis-py）

; ===== 终端日志：跑用例时顺带看接口调用日志 =====
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

; ===== 别递归进这些目录找用例 =====
norecursedirs = .venv .idea __pycache__ .pytest_cache reports .git

; ===== 忽略特定第三方警告 =====
filterwarnings =
    ignore::DeprecationWarning