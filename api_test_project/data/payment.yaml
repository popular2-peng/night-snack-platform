# 支付（POST /api/user/pay）

pay_wechat_mock:                   # 微信 mock：无外部依赖，稳定可测
  channel: WECHAT_MOCK
  prepare: create_pending_order
  expect_code: 0
  expect_order_status: PAID
  expect_qr_code: null             # mock 渠道不返回二维码

pay_alipay:                        # 支付宝
  channel: ALIPAY
  prepare: create_pending_order
  # ⚠️ 沙箱未配置（ALIPAY_APP_ID=placeholder）时，后端会降级成 mock 并直接成功，
  #    此时 qrCode 为 null；配了真实沙箱才会返回 qrCode
  expect_code: 0
  expect_qr_code_or_null: true

pay_status_query:
  # GET /api/user/pay/{orderNo}/status
  prepare: create_and_pay_order
  expect_status: SUCCESS

bad_list:
  - name: order_not_found
    title: 支付订单不存在
    order_no: NSP99999999999999
    channel: WECHAT_MOCK
    expect_code: 4001
  - name: channel_empty
    title: 渠道为空
    channel: ''
    expect_code: 1100
  - name: channel_unsupported
    title: 不支持的渠道
    channel: NOT_A_CHANNEL
    expect_code: 4001
  - name: pay_already_paid
    title: 重复支付（幂等）
    prepare: create_and_pay_order
    channel: WECHAT_MOCK
    expect_code: 4002

callback_idempotent:               # POST /api/pay/alipay/callback（匿名）
  # 同一个 out_trade_no 连发两次通知 → 只处理一次，不重复写 payment_record
  expect_payment_record_count: 1
  expect_order_status: PAID