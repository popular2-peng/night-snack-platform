# ── 业务上限常量（来自后端源码，改代码时这里要同步）──
limits:
  cart_max_quantity: 99         # CartServiceImpl.MAX_QUANTITY，超过返回 2201
  address_max_count: 20         # AddressServiceImpl.MAX_ADDRESS_COUNT，超过返回 2102
  upload_max_size_mb: 5         # UploadServiceImpl.MAX_FILE_SIZE
  upload_sign_limit_per_min: 10 # SIGN_LIMIT_PER_MINUTE，超过返回 6001
  upload_sign_expire_seconds: 60
  allowed_file_ext: [jpg, jpeg, png, webp]   # ALLOWED_TYPES，其余返回 6002