    id: 2
    name: 辣翻天小龙虾
    phone: "13855555555"
    password: m123456
    status: OPEN
    delivery_radius: 4000
  sweet_soup:                    # 老王糖水铺：14:00-23:00，配送 3500m
    id: 3
    name: 老王糖水铺
    phone: "13866666666"
    password: m123456
