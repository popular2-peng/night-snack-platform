    status: OPEN
    delivery_radius: 4500

# ⚠️ 配送范围实测结论（以地址 1「望京SOHO」为收货点，直线距离）：
#   商家 1 深夜食堂    0 m     半径 5000  → 范围内（下单用这个组合）
#   商家 2 辣翻天  10940 m     半径 4000  → 超范围（拿来做 4003 的负面用例）
#   商家 3 老王糖水铺 12152 m   半径 3500  → 超范围
#   商家 7 披萨大王   7318 m     半径 6000  → 超范围
#   商家 8 杨国福      244 m     半径 3000  → 范围內（但已封禁）
#   商家 9 张三烧烤    637 m     半径 4500  → 范围内（但该商家没有商品）
#
# ⭐ 结论：地址 1 + 商家 1 是「营业中 且 在配送范围内」的少数组合之一，
#    所以下单类用例统一用这一对；要测 4003（超出配送范围），
#    用「地址 1 + 商家 2」最省事 —— 不用造任何数据。

products:
  lamb_skewer:                   # 羊肉串 4.00，有 2 个规格
    id: 1
    merchant_key: night_bbq
    name: 羊肉串
    price: "4.00"
    status: ON
    specs:
      small: { id: 1, name: 小份(5串),  price_delta: "0.00", stock: 100 }
      large: { id: 2, name: 大份(10串), price_delta: "3.50", stock: 80 }

  beef_skewer:                   # 牛肉串 5.00 ⭐ 下单主用例用这个
    id: 2
    merchant_key: night_bbq
    name: 牛肉串
    price: "5.00"
    status: ON
    specs:
      small: { id: 3, name: 小份(5串),  price_delta: "0.00", stock: 100 }
      large: { id: 4, name: 大份(10串), price_delta: "4.50", stock: 80 }

  chicken_wing:                  # 烤鸡翅 8.00
    id: 3
    merchant_key: night_bbq
    name: 烤鸡翅
    price: "8.00"
    status: ON
    specs:
      three: { id: 5, name: 3只装, price_delta: "0.00", stock: 50 }
      six:   { id: 6, name: 6只装, price_delta: "7.00", stock: 40 }

  eggplant:                      # 烤茄子 10.00，只有 1 个规格
    id: 4
    merchant_key: night_bbq
    name: 烤茄子
    price: "10.00"
    status: ON
    specs:
      standard: { id: 7, name: 标准份, price_delta: "0.00", stock: 60 }

  chives:                        # 烤韭菜 5.00，只有 1 个规格
    id: 6
    merchant_key: night_bbq
    name: 烤韭菜
    price: "5.00"
    status: ON
    specs:
      standard: { id: 10, name: 标准份, price_delta: "0.00", stock: 80 }

  no_spec_dish:                  # ⭐ 全库唯一的无规格商品（spec 数为 0）
    id: 61
    merchant_key: spicy_crayfish # 属商家 2，注意它不在地址 1 的配送范围内
    name: 测试菜品
    status: ON
    specs: {}                    # 空 = 加购/下单都不能传 specId，cartKey 为 p61

# ⚠️ 关于无规格商品（很关键的三个事实，都是实测的）：
#   1. 全库 61 个商品里，只有 id=61「测试菜品」没有规格
#   2. 商家 1（深夜食堂）的商品**全都有规格**，所以「无规格直接加购」只能用商品 61
#   3. 商品 61 属商家 2，而商家 2 对地址 1 超出配送范围 →
#      用例上要区分：
#        · 购物车用例 → 可以用商品 61（购物车不校验配送范围）
#        · 下单用例   → 需要先造一个商家 2 附近（4km 内）的地址，否则会先撞 4003

