# ============================================================
# 种子数据锚点（只读）
#
# 与 V1__init.sql 的种子数据一致，已对着 nsp_db 实测核对。
#
# ⚠️ 只放「稳定锚点」：id / 名称 / 固定业务属性。
#    用例的输入与期望放各自业务域的 yaml（login.yaml / order.yaml ...）。
# ⚠️ 若手工加过数据导致自增 id 漂移、或重建过库，请同步刷新本文件；
#    更稳妥的做法是运行时用接口查真实 id（见 19 号文档第九节）。
# ============================================================

users:
