    id: 1
    phone: "13800000003"
    password: test123
    status: ACTIVE
  normal_2:                      # 第二个正常用户，用于跨用户越权测试
    id: 2
    phone: "13811111111"
    password: test123
    status: ACTIVE
  banned:                        # 已封禁 → 登录返回 2303
    id: 5
    phone: "13844444444"
    password: test123
    status: DISABLED
  banned_2:
    id: 13
    phone: "13822221118"
    password: test123
    status: DISABLED
  not_exists:                    # 库里不存在 → 登录返回 2003
    phone: "13900000000"

merchants:
  night_bbq:                     # 深夜食堂：18:00-03:00，配送 5000m
    id: 1
