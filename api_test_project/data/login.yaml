# 登录、注册、token 刷新
# 成功用例只写「用哪个账号」，真实手机号从 config/{env}.yaml 的 accounts 里取（随环境变）
# 失败矩阵写死在这里（跨环境不变）

success:
  user:
    account_key: user            # → config.accounts.user
    expect_role: USER
  merchant:
    account_key: merchant
    expect_role: MERCHANT
  admin:
    account_key: admin
    expect_role: ADMIN

# 用户登录失败矩阵（POST /api/user/login）
failed_list:
  - name: password_wrong
    title: 密码错误
    phone: "13800000003"
    password: wrongpwd
    expect_code: 2004
  - name: user_not_found
    title: 手机号未注册
    phone: "13900000000"
    password: test123
    expect_code: 2003
  - name: user_banned
    title: 账号已封禁
    phone: "13844444444"
    password: test123
    expect_code: 2303
  - name: password_empty
    title: 密码为空
    phone: "13800000003"
    password: ""
    expect_code: 1100
  - name: phone_empty
    title: 手机号为空
    phone: ""
    password: test123
    expect_code: 1100
  - name: phone_not_string
    title: 手机号传入整数（类型不符）
    phone: 13800000003          # ⚠️ 故意不加引号，测类型容错
    password: test123
    expect_code: 1100

# 商家登录失败矩阵（POST /api/merchant/login）
merchant_failed_list:
  - name: merchant_not_found
    title: 该手机号未注册商家
    phone: "13900000000"
    password: m123456
    expect_code: 2003
  - name: merchant_banned
    title: 商家已被封禁
    phone: "13812345678"        # 杨国福麻辣烫，status=SUSPENDED
    password: m123456
    expect_code: 7003
  - name: merchant_wrong_password
    title: 商家密码错误
    phone: "13800000002"
    password: wrongpwd
    expect_code: 2004

# 管理员登录失败矩阵（POST /api/admin/login，用 username 不是 phone）
admin_failed_list:
  - name: admin_not_found
    title: 管理员不存在
    username: not_exist_admin
    password: admin123
    expect_code: 2003
  - name: admin_wrong_password
    title: 管理员密码错误
    username: admin
    password: wrongpwd
    expect_code: 2004

# 注册（POST /api/user/register）
# ⚠️ 手机号必须每次运行都唯一 → 用 utils/data_generator.gen_phone() 现造，
#    不要在这里写死，也不能用 seed 里的手机号
register:
  success:
    password: test123
    expect_role: USER
    expect_username_prefix: 普通用户       # 后端自动生成：普通用户 + 8 位随机串
    expect_username_length: 12            # 4 + 8
  duplicate_phone:
    phone: "13800000003"                  # 已存在
    password: test123
    expect_code: 2001
  bad_phone_list:
    - name: too_short
      phone: "1380000"
      expect_code: 1100
    - name: bad_prefix
      phone: "13800000003"                  # 已存在
      expect_code: 1100
    - name: too_long
      phone: "138000000031"                 # 过长
      expect_code: 1100
    - name: not_digit
      phone: "138-0000-0003"               # 不是数字
      expect_code: 1100

# Token 刷新（POST /api/auth/refresh）
refresh:
  bad_list:
    - name: refresh_token_empty
      refresh_token: ''
      expect_code: 1100
    - name: refresh_token_garbage
      refresh_token: "not-a-jwt"
      expect_code: 1004
    - name: access_token_used_as_refresh
      refresh_token: "${ACCESS_TOKEN}"     # 用例运行时用 access token 注入，应被拒
      expect_code: 1004

