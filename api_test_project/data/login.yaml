# 登录、注册、token 刷新
# 成功用例只写「用哪个账号」，真实手机号从 config/{env}.yaml 的 accounts 里取（随环境变）
# 失败矩阵写死在这里（跨环境不变）

success:
  user:
    account_key: user            # → config.accounts.user
    expect_role: USER
  merchant:
    account_key: merchant
    expect_role: MERCHANT
  admin:
    account_key: admin
    expect_role: ADMIN

# 用户登录失败矩阵（POST /api/user/login）
failed_list:
  - name: password_wrong
    title: 密码错误
    phone: "13800000003"
    password: wrongpwd
    expect_code: 2004
  - name: user_not_found
    title: 手机号未注册
    phone: "13900000000"
    password: test123
    expect_code: 2003
  - name: user_banned
    title: 账号已封禁
    phone: "13844444444"
    password: test123
    expect_code: 2303
  - name: password_empty
    title: 密码为空
    phone: "13800000003"
    password: ""
    expect_code: 1100
  - name: phone_empty
    title: 手机号为空
    phone: ""
    password: test123
    expect_code: 1100
  - name: phone_null
    title: 手机号传 null
    phone: null                 # null 会被 @AssertTrue credentialPresent 拦截
    password: test123
    expect_code: 1100

# ── 手机号类型容错（2026-10-10 实测确认，别按直觉写「类型不符 → 1100」）──
# 结论：Jackson 会把 JSON 标量（数字/布尔）**强转**成 String 字段，所以：
#   · 传整数 13800000003 → 转成 "13800000003" → 查得到 → 登录成功（code=0）
#   · 传浮点/布尔        → 转成 "1.38E10" / "true" → 查不到 → 2003 手机号未注册
#   · 传 null            → @AssertTrue 拦截 → 1100
# 只有传「数组 / 对象」这类非标量才是真的类型不匹配 —— 但那会掉进 1999 兜底（见 known_issues）
type_cases:
  - name: phone_int_coerced
    title: 手机号传整数 → 强转成字符串后登录成功
    phone: 13800000003
    password: test123
    expect_code: 0              # ⚠️ 实测 0，不是 1100
  - name: phone_float
    title: 手机号传浮点 → 强转成 "1.38E10" → 查无此账号
    phone: 13800000000.0
    password: test123
    expect_code: 2003           # ⚠️ 实测 2003，不是 1100
  - name: phone_boolean
    title: 手机号传布尔 → 强转成 "true" → 查无此账号
    phone: true
    password: test123
    expect_code: 2003
  - name: phone_array
    title: 手机号传数组 → 真正的类型不匹配
    phone: [13800000003]
    password: test123
    expect_code: 1100           # 期望 1100；⚠️ 实测 1999 → 见 known_issues（用例里用 xfail 标记）

# ── 实测发现的缺陷（可以提给开发）──
known_issues:
  - name: type_mismatch_returns_system_error
    title: 入参类型不匹配时返回 1999「系统繁忙」，而不是 1100「参数校验失败」
    reproduce: 'POST /api/user/login  body: {"phone": [13800000003], "password": "test123"}'
    actual: 1999 系统繁忙，请稍后再试
    expected: 1100 参数校验失败（类型不匹配属于客户端参数问题，不是服务端故障）
    impact:
      - 前端拿到 1999 会提示「系统繁忙」，用户不知道是自己参数传错了
      - 监控上会误报成服务端错误，污染可用性指标
      - 排障时容易被当成后端 bug，浪费时间
    fix_hint: 全局异常处理器捕获 HttpMessageNotReadableException / MethodArgumentTypeMismatchException → 转 1100
    discovered_at: "2026-10-10"

# 商家登录失败矩阵（POST /api/merchant/login）
merchant_failed_list:
  - name: merchant_not_found
    title: 该手机号未注册商家
    phone: "13900000000"
    password: m123456
    expect_code: 2003
  - name: merchant_banned
    title: 商家已被封禁
    phone: "13812345678"        # 杨国福麻辣烫，status=SUSPENDED
    password: m123456
    expect_code: 7003
  - name: merchant_wrong_password
    title: 商家密码错误
    phone: "13800000002"
    password: wrongpwd
    expect_code: 2004

# 管理员登录失败矩阵（POST /api/admin/login，用 username 不是 phone）
admin_failed_list:
  - name: admin_not_found
    title: 管理员不存在
    username: not_exist_admin
    password: admin123
    expect_code: 2003
  - name: admin_wrong_password
    title: 管理员密码错误
    username: admin
    password: wrongpwd
    expect_code: 2004

# 注册（POST /api/user/register）
# ⚠️ 手机号必须每次运行都唯一 → 用 utils/data_generator.gen_phone() 现造，
#    不要在这里写死，也不能用 seed 里的手机号
register:
  success:
    password: test123
    expect_role: USER
    expect_username_prefix: 普通用户       # 后端自动生成：普通用户 + 8 位随机串
    expect_username_length: 12            # 4 + 8
  duplicate_phone:
    phone: "13800000003"                  # 已存在
    password: test123
    expect_code: 2001
  bad_phone_list:
    - name: too_short
      phone: "1380000"
      expect_code: 1100
    - name: bad_prefix
      phone: "12800000001"                # 12 开头不合法
      expect_code: 1100
    - name: too_long
      phone: "138000000031"
      expect_code: 1100
    - name: not_digit
      phone: "138-0000-0003"
      expect_code: 1100

# Token 刷新（POST /api/auth/refresh）
refresh:
  bad_list:
    - name: refresh_token_empty
      refresh_token: ''
      expect_code: 1100
    - name: refresh_token_garbage
      refresh_token: "not-a-jwt"
      expect_code: 1004
    - name: access_token_used_as_refresh
      refresh_token: "${ACCESS_TOKEN}"     # 用例运行时用 access token 注入，应被拒
      expect_code: 1004

